
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160b25">
<title>Mi Sala de Estar | Casa-Lumi</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:radial-gradient(circle at top,#48245f,#160b25 80%);
 color:#fff0ff;
 font-family:Arial,sans-serif;
}
main{
 max-width:680px;
 margin:auto;
 padding:18px 12px 45px;
}
.volver{
 display:inline-block;
 color:#eac7ff;
 text-decoration:none;
 margin-bottom:18px;
}
h1,h2,.subtitulo{text-align:center}
h1{color:#f1caff;margin-bottom:8px}
.subtitulo{color:#e2b5ff;margin-bottom:24px}
.casilla{
 background:#29163d;
 border:3px solid #c77cff;
 border-radius:24px;
 padding:12px;
 margin-bottom:20px;
 box-shadow:0 0 18px #b76cff55;
}
.casilla h2{font-size:20px;color:#f1caff}
.casilla img{
 display:block;
 width:100%;
 height:auto;
 border-radius:14px;
}
.oculto{display:none!important}
.aviso{
 text-align:center;
 line-height:1.6;
 padding:20px;
 color:#ead0ff;
}
#mensaje{
 text-align:center;
 line-height:1.6;
 color:#ead0ff;
}
button{
 display:block;
 margin:20px auto;
 padding:13px 22px;
 border:2px solid #e4a9ff;
 border-radius:18px;
 background:#643481;
 color:white;
 font-size:16px;
 cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>

<body>
<main>
<a class="volver" href="index.html">
← Volver a Casa-Lumi
</a>

<h1>💜 Mi Sala de Estar 💜</h1>
<p class="subtitulo" id="temporada">Preparando mi sala...</p>

<section class="casilla">
<h2>🏡 Mi ambiente</h2>
<img id="ambiente" class="oculto" alt="Sala de estar">
<p class="aviso oculto" id="aviso-ambiente"></p>
</section>

<section class="casilla">
<h2>✨ ¿Qué estoy haciendo?</h2>
<img id="actividad" class="oculto" alt="Actividad de Lumi">
<p class="aviso oculto" id="aviso-actividad"></p>
</section>

<section class="casilla">
<h2>♡ Mi estado actual ♡</h2>
<img id="estado" class="oculto" alt="Estado de Lumi">
<p class="aviso oculto" id="aviso-estado"></p>
</section>

<p id="mensaje" aria-live="polite"></p>

<button id="otra-actividad" type="button">
✨ Otra actividad
</button>
</main>

<script>
"use strict";

/* CASA-LUMI - SALA DE ESTAR */

const BASE="assets/";

const AMBIENTES={
 dia:"sala-dia-sofa.png",
 tarde:"sala-tarde.png",
 noche:"sala-noche-sofa.png"
};

const ACTIVIDADES={
 dia:[
  {
   nombre:"Leyendo un libro",
   emocion:"Tranquila",
   mensaje:"¡Qué linda mañana para leer! 💜",
   imagen:"sala-dia-lectura.png"
  },
  {
   nombre:"Usando mi notebook",
   emocion:"Concentrada",
   mensaje:"Estoy organizando mis ideas ✨",
   imagen:"sala-dia-escritorio.png"
  },
  {
   nombre:"Descansando en el sillón",
   emocion:"Relajada",
   mensaje:"Disfrutando un ratito de calma 💜",
   imagen:"sala-dia-sofa.png"
  }
 ],
 tarde:[
  {
   nombre:"Leyendo un libro",
   emocion:"Tranquila",
   mensaje:"Una tarde perfecta para leer 📖",
   imagen:null
  },
  {
   nombre:"Tomando once",
   emocion:"Contenta",
   mensaje:"¡Llegó la hora de la once! ☕",
   imagen:null
  },
  {
   nombre:"Viendo una película",
   emocion:"Feliz",
   mensaje:"Una película para disfrutar la tarde 💜",
   imagen:null
  },
  {
   nombre:"Usando mi notebook",
   emocion:"Concentrada",
   mensaje:"Tengo algunas ideas nuevas ✨",
   imagen:null
  },
  {
   nombre:"Escuchando música",
   emocion:"Alegre",
   mensaje:"Un poquito de música para mi tarde 🎵",
   imagen:null
  }
 ],
 noche:[
  {
   nombre:"Descansando en el sillón",
   emocion:"Relajada",
   mensaje:"Qué agradable está la noche 🌙",
   imagen:"sala-noche-sofa.png"
  },
  {
   nombre:"Leyendo un libro",
   emocion:"Tranquila",
   mensaje:"Un capítulo más antes de descansar 📖",
   imagen:"sala-noche-lectura.png"
  },
  {
   nombre:"Viendo una película",
   emocion:"Contenta",
   mensaje:"Una película para terminar el día 💜",
   imagen:null
  }
 ]
};

let escenaActual=null;
let periodoActual="";
let temporadaActual="";

function obtenerTemporada(fecha){
 const mes=fecha.getMonth()+1;
 if(mes===9)return "fiestasPatrias";
 if(mes===12||mes<=2)return "verano";
 if(mes>=3&&mes<=5)return "otono";
 if(mes>=6&&mes<=8)return "invierno";
 return "primavera";
}

function obtenerPeriodo(fecha){
 const hora=fecha.getHours();
 if(hora>=6&&hora<12)return "dia";
 if(hora>=12&&hora<20)return "tarde";
 return "noche";
}

function mostrarImagen(id,archivo,avisoTexto){
 const imagen=document.getElementById(id);
 const aviso=document.getElementById("aviso-"+id);

 imagen.onload=null;
 imagen.onerror=null;
 imagen.classList.add("oculto");

 if(!archivo){
  imagen.removeAttribute("src");
  aviso.textContent=avisoTexto;
  aviso.classList.remove("oculto");
  return;
 }

 aviso.classList.add("oculto");

 imagen.onload=()=>{
  imagen.classList.remove("oculto");
  aviso.classList.add("oculto");
 };

 imagen.onerror=()=>{
  imagen.classList.add("oculto");
  aviso.textContent=avisoTexto;
  aviso.classList.remove("oculto");
 };

 imagen.src=BASE+archivo;
}

function actualizarTitulo(){
 const temporadas={
  fiestasPatrias:"🇨🇱 Fiestas Patrias",
  verano:"☀️ Verano",
  otono:"🍂 Otoño",
  invierno:"❄️ Invierno",
  primavera:"🌸 Primavera"
 };

 const periodos={
  dia:"☀️ De día",
  tarde:"🌅 De tarde",
  noche:"🌙 De noche"
 };

 document.getElementById("temporada").textContent=
 temporadas[temporadaActual]+" · "+periodos[periodoActual];
}

function mostrarEscena(){
 if(!escenaActual)return;

 mostrarImagen(
  "ambiente",
  AMBIENTES[periodoActual],
  "El ambiente de este horario aún no está subido."
 );

 mostrarImagen(
  "actividad",
  escenaActual.imagen,
  "Actividad actual: "+escenaActual.nombre
 );

 mostrarImagen(
  "estado",
  null,
  "Emoción actual: "+escenaActual.emocion+" 💜"
 );

 document.getElementById("mensaje").textContent=
 escenaActual.mensaje;
}

function elegirActividad(){
 const ahora=new Date();

 temporadaActual=obtenerTemporada(ahora);
 periodoActual=obtenerPeriodo(ahora);

 actualizarTitulo();

 const disponibles=ACTIVIDADES[periodoActual]||[];
 const boton=document.getElementById("otra-actividad");

 boton.disabled=disponibles.length===0;

 if(disponibles.length===0){
  escenaActual=null;
  return;
 }

 let opciones=disponibles.filter(
  escena=>escena!==escenaActual
 );

 if(opciones.length===0)opciones=disponibles;

 escenaActual=opciones[
  Math.floor(Math.random()*opciones.length)
 ];

 mostrarEscena();
}

function revisarHorario(){
 const ahora=new Date();
 const periodo=obtenerPeriodo(ahora);
 const temporada=obtenerTemporada(ahora);

 if(periodo!==periodoActual||
    temporada!==temporadaActual){
  elegirActividad();
 }
}

document.getElementById("otra-actividad")
 .addEventListener("click",elegirActividad);

elegirActividad();

setInterval(revisarHorario,60000);

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)revisarHorario();
});
</script>
</body>
</html>
