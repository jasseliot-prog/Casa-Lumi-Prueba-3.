<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#160b25">
<title>Mi Clóset Mágico | Casa-Lumi</title>

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(
    circle at top,
    #38204e,
    #160b25 75%
  );
  color:#f5efff;
  font-family:Arial,sans-serif;
  text-align:center;
}

main {
  max-width:650px;
  margin:auto;
  padding:24px 14px 50px;
}

h1 {
  color:#d4b2ff;
  font-size:30px;
}

h2 {
  font-size:24px;
}

p {
  line-height:1.6;
}

.escenario,
.panel {
  background:#29183d;
  border:2px solid #76529b;
  border-radius:26px;
  padding:22px 12px;
  margin:22px 0;
}

.escenario {
  box-shadow:0 0 24px #a77cdb44;
}

.personaje {
  display:block;
  width:min(100%,340px);
  max-height:450px;
  height:auto;
  object-fit:contain;
  margin:0 auto;
  filter:drop-shadow(
    0 0 18px #b17eff55
  );
  animation:respirar 3s ease-in-out infinite;
}

.personaje[hidden] {
  display:none;
}

@keyframes respirar {
  0%,100% {
    transform:translateY(0);
  }
  50% {
    transform:translateY(-5px);
  }
}

button,
.volver {
  display:inline-block;
  margin:5px;
  padding:12px 15px;
  border:2px solid #c38aff;
  border-radius:16px;
  background:linear-gradient(
    145deg,
    #77449d,
    #48235e
  );
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
}

button.activo {
  background:#b78ae7;
  color:#160b25;
  border-color:white;
}

.botones {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
}

#frase,
#estado-clima,
#emocion-actual {
  color:#e9caff;
}

#aviso-imagen {
  color:#e9caff;
  font-size:14px;
}

#temperatura {
  width:min(100%,350px);
  accent-color:#b783f5;
}

.nota {
  color:#cbb4df;
  font-size:13px;
}

@media (prefers-reduced-motion:reduce) {
  .personaje {
    animation:none;
  }
}
</style>
</head>

<body>
<main>

<a class="volver" href="../index.html">
  ☾ Volver a Casa-Lumi
</a>

<h1>👗 Mi Clóset Mágico</h1>

<p>
  Mi ropa cambia con el clima,
  la hora y las celebraciones.
</p>

<section class="escenario">

  <img
    id="lumi-imagen"
    class="personaje"
    alt="Lumi con su vestuario"
    hidden
  >

  <p id="aviso-imagen" role="status">
    Preparando a Lumi...
  </p>

  <h2 id="conjunto">
    Preparando vestuario...
  </h2>

  <p id="frase"></p>

  <p id="emocion-actual" aria-live="polite"></p>

</section>

<section class="panel">
  <h2>💜 Mis emociones</h2>

  <div
    id="opciones-emociones"
    class="botones">
  </div>
</section>

<section class="panel">
  <h2>👗 Mis conjuntos</h2>

  <div
    id="opciones"
    class="botones">
  </div>
</section>

<section class="panel">

  <h2>🌤️ Vestuario automático</h2>

  <p>
    <label for="temperatura">
      Temperatura de prueba:
    </label>

    <span id="temperatura-valor">
      20
    </span> °C
  </p>

  <input
    id="temperatura"
    type="range"
    min="0"
    max="40"
    value="20"
  >

  <p>
    <button id="automatico" type="button">
      ✨ Vestuario automático
    </button>
  </p>

  <p id="estado-clima" role="status"></p>

</section>

<p class="nota">
  ✦ Casa-Lumi · Mi pequeño mundo digital ✦
</p>

</main>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {

  // ====================================
  // LOS 10 CONJUNTOS OFICIALES
  // ====================================

  const nombres = {
    invierno:"❄️ Invierno",
    verano:"☀️ Verano",
    primavera:"🌸 Primavera",
    otono:"🍂 Otoño",
    navidad:"🎄 Navidad",
    "ano-nuevo":"✨ Año Nuevo",
    "san-valentin":"💕 San Valentín",
    "fiestas-patrias":"🇨🇱 Fiestas Patrias",
    "pijama-verano":"🌙 Pijama verano",
    "pijama-invierno":"⭐ Pijama invierno"
  };

  // ====================================
  // EMOCIONES
  // ====================================

  const emociones = {
    feliz:"😊 Feliz",
    triste:"😢 Triste",
    enojada:"😠 Enojada",
    sorprendida:"😮 Sorprendida",
    tranquila:"😌 Tranquila",
    somnolienta:"😴 Con sueño",
    emocionada:"🤩 Emocionada"
  };

  const frases = {
    feliz:"¡Qué bonito día!",
    triste:"Hoy estoy un poquito triste.",
    enojada:"¡Grrr! Necesito un momento.",
    sorprendida:"¡Oh! ¡Qué sorpresa!",
    tranquila:"Estoy disfrutando mi día.",
    somnolienta:"Creo que tengo sueño...",
    emocionada:"¡Qué emoción!"
  };

  // ====================================
  // ELEMENTOS
  // ====================================

  const imagen =
    document.getElementById("lumi-imagen");

  const avisoImagen =
    document.getElementById("aviso-imagen");

  const conjunto =
    document.getElementById("conjunto");

  const frase =
    document.getElementById("frase");

  const emocionTexto =
    document.getElementById("emocion-actual");

  const estadoClima =
    document.getElementById("estado-clima");

  const temperatura =
    document.getElementById("temperatura");

  let ropaActual = "verano";
  let emocionActual = "tranquila";

  let solicitudImagen = 0;
  let solicitudClima = 0;

  // ====================================
  // RUTAS DE LAS IMÁGENES
  // ====================================

  const rutaOriginales = "originales/";
  const rutaEmociones = "emociones/";

  function obtenerRutas() {
    const ropa = ropaActual;
    const emocion = emocionActual;

    return [
      `${rutaEmociones}${ropa}/${emocion}.png`,
      `${rutaEmociones}${ropa}/${emocion}.webp`,
      `${rutaOriginales}${ropa}.webp`,
      `${rutaOriginales}${ropa}.png`,
      `${rutaOriginales}${ropa}.jpg`,
      `${rutaOriginales}${ropa}.jpeg`
    ];
  }

  // ====================================
  // CARGAR IMAGEN DE LUMI
  // ====================================

  function cargarImagen() {
    const solicitud = ++solicitudImagen;
    const rutas = obtenerRutas();

    imagen.hidden = true;

    avisoImagen.textContent =
      "✨ Preparando a Lumi...";

    let indice = 0;

    function probarSiguiente() {

      if (solicitud !== solicitudImagen) {
        return;
      }

      if (indice >= rutas.length) {
        imagen.hidden = true;
        imagen.removeAttribute("src");

        avisoImagen.textContent =
          "💜 No encuentro la imagen de " +
          ropaActual +
          ". Revisa su nombre en originales.";

        return;
      }

      const ruta = rutas[indice++];
      const prueba = new Image();

      prueba.onload = () => {
        if (solicitud !== solicitudImagen) {
          return;
        }

        imagen.onload = () => {
          if (solicitud !== solicitudImagen) {
            return;
          }

          imagen.hidden = false;
          avisoImagen.textContent = "";
        };

        imagen.onerror = probarSiguiente;
        imagen.src = ruta;
      };

      prueba.onerror = probarSiguiente;
      prueba.src = ruta;
    }

    probarSiguiente();
  }

  // ====================================
  // BOTONES ACTIVOS
  // ====================================

  function actualizarBotones(idContenedor,actual) {
    const contenedor =
      document.getElementById(idContenedor);

    contenedor.querySelectorAll("button")
      .forEach(boton => {
        boton.classList.toggle(
          "activo",
          boton.dataset.id === actual
        );
      });
  }

  // ====================================
  // CAMBIAR VESTUARIO
  // ====================================

  function cambiarRopa(id) {
    if (!nombres[id]) return;

    ropaActual = id;
    conjunto.textContent = nombres[id];

    actualizarBotones("opciones",id);
    cargarImagen();
  }

  // ====================================
  // CAMBIAR EMOCIÓN
  // ====================================

  function cambiarEmocion(id) {
    if (!emociones[id]) return;

    emocionActual = id;

    emocionTexto.textContent = emociones[id];
    frase.textContent = frases[id];

    actualizarBotones(
      "opciones-emociones",
      id
    );

    cargarImagen();
  }

  // ====================================
  // CREAR BOTONES
  // ====================================

  function crearBotones(datos,idContenedor,accion) {
    const contenedor =
      document.getElementById(idContenedor);

    Object.entries(datos).forEach(([id,nombre]) => {

      const boton =
        document.createElement("button");

      boton.type = "button";
      boton.dataset.id = id;
      boton.textContent = nombre;

      boton.addEventListener("click",() => {
        accion(id);
      });

      contenedor.appendChild(boton);
    });
  }

  crearBotones(
    nombres,
    "opciones",
    id => {
      solicitudClima++;
      cambiarRopa(id);

      estadoClima.textContent =
        "Mostrando el traje que elegiste.";
    }
  );

  crearBotones(
    emociones,
    "opciones-emociones",
    cambiarEmocion
  );

  // ====================================
  // VESTUARIO SEGÚN FECHA Y CLIMA
  // ====================================

  function elegirRopa(grados) {
    const ahora = new Date();

    const mes = ahora.getMonth() + 1;
    const dia = ahora.getDate();
    const hora = ahora.getHours();

    // Celebraciones especiales.

    if (mes === 12 && (dia === 24 || dia === 25)) {
      return "navidad";
    }

    if (
      (mes === 12 && dia === 31) ||
      (mes === 1 && dia === 1)
    ) {
      return "ano-nuevo";
    }

    if (mes === 2 && dia === 14) {
      return "san-valentin";
    }

    if (mes === 9 && (dia === 18 || dia === 19)) {
      return "fiestas-patrias";
    }

    // Pijamas por horario.

    if (hora >= 21 || hora < 7) {
      return grados < 18
        ? "pijama-invierno"
        : "pijama-verano";
    }

    // Temperaturas extremas.

    if (grados <= 14) return "invierno";
    if (grados >= 27) return "verano";

    // Estaciones del hemisferio sur.

    if (mes >= 3 && mes <= 5) {
      return "otono";
    }

    if (mes >= 9 && mes <= 11) {
      return "primavera";
    }

    return grados < 19
      ? "invierno"
      : "verano";
  }

  function aplicarTemperatura(grados) {
    const ropa = elegirRopa(grados);
    cambiarRopa(ropa);
  }

  // ====================================
  // CLIMA REAL
  // ====================================

  function obtenerUbicacion() {
    return new Promise((resolver,rechazar) => {

      if (!navigator.geolocation) {
        rechazar(
          new Error("Ubicación no disponible")
        );
        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolver,
        rechazar,
        {
          timeout:12000,
          enableHighAccuracy:false
        }
      );
    });
  }

  async function automatico() {
    const solicitud = ++solicitudClima;

    estadoClima.textContent =
      "Consultando el clima...";

    try {
      const posicion = await obtenerUbicacion();

      if (solicitud !== solicitudClima) return;

      const latitud =
        posicion.coords.latitude;

      const longitud =
        posicion.coords.longitude;

      const url = new URL(
        "https://api.open-meteo.com/v1/forecast"
      );

      url.search = new URLSearchParams({
        latitude:latitud.toFixed(2),
        longitude:longitud.toFixed(2),
        current:"temperature_2m",
        temperature_unit:"celsius"
      });

      const controlador = new AbortController();

      const limite = setTimeout(() => {
        controlador.abort();
      },10000);

      let respuesta;

      try {
        respuesta = await fetch(url,{
          signal:controlador.signal
        });
      } finally {
        clearTimeout(limite);
      }

      if (!respuesta.ok) {
        throw new Error("Error al consultar clima");
      }

      const datos = await respuesta.json();

      const grados =
        datos.current?.temperature_2m;

      if (!Number.isFinite(grados)) {
        throw new Error("Temperatura no disponible");
      }

      if (solicitud !== solicitudClima) return;

      temperatura.value = Math.max(
        0,
        Math.min(40,Math.round(grados))
      );

      document.getElementById(
        "temperatura-valor"
      ).textContent = grados;

      aplicarTemperatura(grados);

      estadoClima.textContent =
        `🌤️ Temperatura actual: ${grados} °C`;

    } catch (error) {
      if (solicitud !== solicitudClima) return;

      const grados = Number(temperatura.value);

      aplicarTemperatura(grados);

      estadoClima.textContent =
        "No pude consultar el clima real. " +
        "Usando temperatura de prueba.";
    }
  }

  // ====================================
  // CONTROL MANUAL DE TEMPERATURA
  // ====================================

  temperatura.addEventListener("input",() => {
    solicitudClima++;

    const grados = Number(temperatura.value);

    document.getElementById(
      "temperatura-valor"
    ).textContent = grados;

    aplicarTemperatura(grados);

    estadoClima.textContent =
      `Modo prueba: ${grados} °C`;
  });

  document.getElementById("automatico")
    .addEventListener("click",automatico);

  // ====================================
  // ACCESO A EMOCIONES DESDE CASA-LUMI
  // ====================================

  window.LumiEmociones = {
    cambiar:cambiarEmocion,
    obtener:() => emocionActual
  };

  // ====================================
  // INICIAR LUMI
  // ====================================

  cambiarEmocion("tranquila");
  cambiarRopa("verano");

  automatico();

  // Revisar cambios de horario cada minuto.
  setInterval(() => {
    if (document.visibilityState !== "visible") {
      return;
    }

    if (
      estadoClima.textContent.includes(
        "Temperatura actual:"
      )
    ) {
      aplicarTemperatura(
        Number(temperatura.value)
      );
    }
  },60000);

});
</script>

</body>
</html>
