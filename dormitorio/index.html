
<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160b25">
<title>Mi Dormitorio | Casa-Lumi</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10051c;
  color: white;
  font-family: Arial, sans-serif;
}

/* Escenario principal */
.escenario {
  position: relative;
  width: 100%;
  max-width: 1536px;
  margin: 0 auto;
  overflow: hidden;
}

/* Imagen del dormitorio */
.fondo {
  display: block;
  width: 100%;
  height: auto;
}

/* Botones invisibles sobre la ilustración */
.boton {
  position: absolute;
  top: 1%;
  height: 10%;
  z-index: 5;
  cursor: pointer;
  border-radius: 12px;
  -webkit-tap-highlight-color: transparent;
}

.boton:focus-visible {
  outline: 3px solid #ffffff;
  outline-offset: 2px;
}

/* Navegación */
.inicio {
  left: 27%;
  width: 7%;
}

.hogar {
  left: 35%;
  width: 7%;
}

.closet {
  left: 43%;
  width: 7%;
}

.lulu {
  left: 51%;
  width: 7%;
}

.calendario {
  left: 59%;
  width: 7%;
}

.musica {
  left: 67%;
  width: 7%;
}

.asistente {
  left: 75%;
  width: 7%;
}

/* Reloj real */
.reloj {
  position: absolute;
  top: 3%;
  left: 86%;
  width: 8%;
  z-index: 6;

  color: #ffffff;
  text-align: center;
  font-size: clamp(10px, 2.2vw, 34px);
  font-weight: bold;

  text-shadow:
    0 0 6px #b64aff,
    0 0 12px #b64aff;

  background: #180626;
  border-radius: 8px;
  padding: 2px;
}

/* Ajustes para celulares */
@media (max-width: 600px) {
  .escenario {
    width: 100%;
  }

  .boton {
    top: 1%;
    height: 11%;
  }

  .reloj {
    font-size: clamp(8px, 2.2vw, 15px);
  }
}
</style>
</head>

<body>

<main class="escenario">

  <!-- Imagen oficial del dormitorio -->
  <img
    class="fondo"
    src="dormitorio-casa-lumi.png"
    alt="Dormitorio mágico de Lumi"
  >

  <!-- Navegación principal -->

  <a
    class="boton inicio"
    href="../index.html"
    aria-label="Inicio">
  </a>

  <a
    class="boton hogar"
    href="../index.html"
    aria-label="Hogar">
  </a>

  <a
    class="boton closet"
    href="../dressingroom/"
    aria-label="Clóset">
  </a>

  <a
    class="boton lulu"
    href="../index.html"
    aria-label="Lulú">
  </a>

  <a
    class="boton calendario"
    href="../calendario/"
    aria-label="Calendario">
  </a>

  <a
    class="boton musica"
    href="../index.html"
    aria-label="Música">
  </a>

  <a
    class="boton asistente"
    href="../index.html"
    aria-label="Asistente">
  </a>

  <!-- Reloj -->
  <div
    class="reloj"
    id="reloj"
    aria-label="Hora actual">
    00:00
  </div>

</main>

<script>
"use strict";

/* Reloj automático */
function actualizarReloj() {
  const ahora = new Date();

  const hora = ahora.toLocaleTimeString("es-CL", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  const reloj = document.getElementById("reloj");

  if (reloj) {
    reloj.textContent = hora;
  }
}

/* Iniciar reloj */
actualizarReloj();

/* Actualizar cada segundo */
setInterval(actualizarReloj, 1000);

</script>

</body>
</html>
